name: Cobrinha de contribuições

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gerar animação
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Pedro-Lucas001
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%23C24E12
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF782D

      - name: Publicar imagens
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
